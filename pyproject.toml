[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aprilfold"
version = "0.1.0"
description = "Foldable single-color AprilTag/ArUco cubes and printed robot twins for 6-DoF pose tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aprilfold contributors" }]
keywords = ["apriltag", "aruco", "fiducial", "pose-estimation", "3d-printing", "teleoperation", "urdf"]
requires-python = ">=3.10"
dependencies = [
    "opencv-contrib-python>=4.8,<5",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mono = [
    "manifold3d>=3.0",
]
twin = [
    "manifold3d>=3.0",
    "trimesh>=4.0",
    "scipy>=1.10",
]
test = [
    "pytest>=8.0",
    "manifold3d>=3.0",
    "trimesh>=4.0",
    "scipy>=1.10",
]

[project.scripts]
aprilfold = "aprilfold.cli:main"

[project.urls]
Homepage = "https://github.com/muayad-chalabi/aprilfold"
Documentation = "https://github.com/muayad-chalabi/aprilfold/blob/main/docs/usage.md"
Issues = "https://github.com/muayad-chalabi/aprilfold/issues"
Changelog = "https://github.com/muayad-chalabi/aprilfold/blob/main/CHANGELOG.md"
Upstream = "https://github.com/younghyopark/aprilcube"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests/*.py",
    "/tests/README.md",
    "/examples",
    "/assets/end_effector_connector.stl",
    "/docs/usage.md",
    "/README.md",
    "/LICENSE",
    "/NOTICE.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel.force-include]
"assets/end_effector_connector.stl" = "aprilfold/assets/end_effector_connector.stl"
