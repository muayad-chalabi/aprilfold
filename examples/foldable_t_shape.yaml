# Foldable T-shaped target: five cube modules joined by printed rivets.
# aprilfold generate examples/foldable_t_shape.yaml
output: models/foldable_t_shape
shape:
  type: voxel_cuboids
  voxel_size_mm: 40
  cuboids:
    - name: stem
      origin: [1, 0, 0]
      size: [1, 1, 3]
    - name: crossbar
      origin: [0, 0, 2]
      size: [3, 1, 1]
dictionary: 4x4_50
size:
  tag_size_mm: 30
layout:
  margin_cells: 1
  border_cells: 1
mono: true
