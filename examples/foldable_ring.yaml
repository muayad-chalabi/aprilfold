# Foldable ring: a 3x3 frame with the center missing, the smallest closed loop.
# aprilfold generate examples/foldable_ring.yaml
output: models/foldable_ring
shape:
  type: voxel_grid
  voxel_size_mm: 40
  voxels: [[0, 0, 0], [1, 0, 0], [2, 0, 0], [0, 1, 0], [2, 1, 0], [0, 2, 0], [1, 2, 0], [2, 2, 0]]
dictionary: 4x4_50
size:
  tag_size_mm: 30
layout:
  margin_cells: 1
  border_cells: 1
mono: true
